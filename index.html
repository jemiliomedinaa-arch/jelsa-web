<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo JELSA | Corporativo de Soluciones Integrales</title>
    <!-- Tipografías corporativas -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-mex: #00843D;
            --rojo-mex: #C8102E;
            --negro-titulo: #000000;
            --gris-texto: #333333;
            --gris-fondo: #f9f9f9;
            --blanco: #ffffff;
            --transicion: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: var(--gris-texto);
            background-color: var(--blanco);
            scroll-behavior: smooth;
        }

        /* --- Header / Menú con Logos de Mayor Tamaño --- */
        header {
            background: var(--blanco);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
        }

        .brand-logo-gj {
            height: 75px; /* Aumentado para mayor presencia y legibilidad */
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply; /* Fusión limpia del fondo blanco */
            background-color: transparent;
        }

        .brand-logo-text {
            height: 55px; /* Aumentado para mayor presencia y legibilidad */
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply; /* Fusión limpia del fondo blanco */
            background-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--gris-texto);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transicion);
        }

        nav ul li a:hover {
            color: var(--verde-mex);
        }

        .btn-contacto-nav {
            background-color: var(--rojo-mex);
            color: var(--blanco) !important;
            padding: 10px 20px;
            border-radius: 3px;
        }

        .btn-contacto-nav:hover {
            background-color: var(--verde-mex);
        }

        /* --- Hero Banner --- */
        .hero {
            height: 65vh;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.6)), 
                        url('angel-jelsa.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--blanco);
            padding: 0 10%;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto 25px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .btn-hero {
            background-color: var(--rojo-mex);
            color: var(--blanco);
            padding: 12px 30px;
            border: none;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transicion);
        }

        .btn-hero:hover {
            background-color: var(--verde-mex);
        }

        /* --- Secciones --- */
        section {
            padding: 80px 10%;
        }

        .section-title-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: var(--negro-titulo);
            margin-bottom: 10px;
        }

        .deco-line {
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, var(--verde-mex) 50%, var(--rojo-mex) 50%);
            margin: 0 auto;
        }

        .intro-text {
            text-align: center;
            font-size: 1.15rem;
            max-width: 900px;
            margin: 0 auto;
            color: var(--gris-texto);
            line-height: 1.8;
        }

        .mv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .mv-card {
            background-color: var(--gris-fondo);
            padding: 40px;
            border-radius: 4px;
            border-top: 4px solid var(--verde-mex);
            transition: var(--transicion);
        }

        .mv-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .mv-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--negro-titulo);
            margin-bottom: 15px;
        }

        /* --- Divisiones --- */
        .divisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .division-card {
            background: var(--blanco);
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border-bottom: 3px solid var(--verde-mex);
        }

        .division-card h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--negro-titulo);
            margin-bottom: 12px;
        }

        .division-card p {
            font-size: 0.95rem;
            color: var(--gris-texto);
        }

        /* --- Sectores --- */
        .sectores-container {
            background-color: var(--gris-fondo);
        }

        .sectores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .sector-box {
            background: var(--blanco);
            padding: 25px 20px;
            text-align: center;
            border-radius: 6px;
            border-left: 4px solid var(--verde-mex);
            font-weight: 600;
            color: var(--negro-titulo);
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
            font-size: 1.05rem;
        }

        /* --- Valores --- */
        .valores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .valor-card {
            background: var(--gris-fondo);
            padding: 20px 25px;
            border-left: 4px solid var(--verde-mex);
            border-radius: 4px;
            font-weight: 600;
            color: var(--gris-texto);
            font-size: 0.95rem;
        }

        /* --- Acrónimo --- */
        .acronimo-section {
            background-color: #111111;
            color: var(--blanco);
        }

        .acronimo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .acronimo-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px 15px;
            border-radius: 6px;
            text-align: center;
            border-top: 3px solid var(--verde-mex);
        }

        .acronimo-letra {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--verde-mex);
            line-height: 1;
            margin-bottom: 10px;
        }

        .acronimo-card p {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* --- Contacto --- */
        .contact-container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--blanco);
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transicion);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--verde-mex);
            outline: none;
        }

        .btn-submit {
            background-color: var(--verde-mex);
            color: var(--blanco);
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transicion);
        }

        .btn-submit:hover {
            background-color: var(--negro-titulo);
        }

        /* --- Filosofía --- */
        .philosophy-banner {
            background-color: var(--negro-titulo);
            color: var(--blanco);
            text-align: center;
            padding: 80px 10%;
        }

        .philosophy-banner h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-style: italic;
            font-weight: 400;
            margin-bottom: 15px;
            line-height: 1.5;
        }

            font-size: 0.8rem;
            letter-spacing: 3px;
            text
